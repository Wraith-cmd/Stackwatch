name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke test
        run: |
          python -m pip install --quiet lupa
          python -c "from lupa import lua51; lua51.LuaRuntime().execute(open('tests/smoke.lua').read())"

      - name: Compatibility with live Blizzard source
        run: node tests/compat_check.mjs live
